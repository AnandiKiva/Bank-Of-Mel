<html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bank of Mel — Create</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="create">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon">★</div>
        <div class="brand-title">Bank of Mel</div>
      </div>
      <nav class="main-nav">
        <a href="index.html" class="nav-item active">Create</a>
        <a href="deposit.html" class="nav-item">Deposit</a>
        <a href="withdraw.html" class="nav-item">Withdraw</a>
        <a href="balance.html" class="nav-item">Balance</a>
        <a href="history.html" class="nav-item">History</a>
        <a href="details.html" class="nav-item">Details</a>
      </nav>
    </div>
  </header>

  <main class="page-wrap">
    <section class="card center-card">
      <h3 class="card-title"><span class="icon">➕</span> Create New Account</h3>
      <p class="muted">Start your banking journey with Bank of Mel</p>

      <form id="createAccountForm" class="form-grid">
        <label>
          <div class="label">Full Name</div>
          <input id="createFullName" placeholder="Enter your full name" required>
        </label>

        <label>
          <div class="label">Account Number</div>
          <input id="createAccountNumber" placeholder="Enter account number (optional)">
        </label>

        <label>
          <div class="label">Initial Deposit (R)</div>
          <input id="createInitial" type="number" step="0.01" placeholder="Enter initial deposit amount">
        </label>

        <div style="grid-column:1/-1">
          <button type="submit" class="btn-primary full">Create Account</button>
        </div>
      </form>
    </section>

    <footer class="footer">© 2025 Bank of Mel. Banking made beautiful.</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
